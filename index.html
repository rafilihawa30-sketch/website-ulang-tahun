<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Happy Birthday! 🎉</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Font Google untuk tampilan elegan -->
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Canvas Confetti untuk efek kembang api -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

  <!-- Musik Latar (Opsional: ganti link mp3 sesuai keinginan) -->
  <audio id="bg-music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <!-- Container Efek Hati Melayang -->
  <div class="hearts-container" id="heartsContainer"></div>

  <!-- Card Utama -->
  <main class="card">
    <div class="profile-frame">
      <!-- Ganti foto jika ada -->
      <div class="avatar">🎂</div>
    </div>
    
    <h1 class="title">Selamat Ulang Tahun! ✨</h1>
    
    <!-- Teks Pesan Efek Ketik -->
    <div class="message-box">
      <p id="typed-text"></p>
    </div>

    <div class="action-buttons">
      <button id="btnSurprise" class="btn btn-primary">🎁 Buka Kejutan</button>
      <button id="btnMusic" class="btn btn-secondary">🎵 Musik: Off</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
